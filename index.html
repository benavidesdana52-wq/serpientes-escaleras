<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serpientes y Escaleras - Versión Avanzada</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería para álgebra lineal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/numeric/1.2.6/numeric.min.js"></script>
</head>
<body>

    <div class="pantalla">
        <h1>🐍 Serpientes y Escaleras 🪜</h1>

        <!-- MODO CONFIGURACIÓN -->
        <div id="modoConfiguracion" class="modo-activo">
            <div class="panel-config">
                <h2>⚙️ Configurar Juego</h2>
                
                <div class="config-inputs">
                    <label>
                        ¿Cuántas serpientes?
                        <input type="number" id="cantSerpientes" min="1" max="10" value="5">
                    </label>
                    <label>
                        ¿Cuántas escaleras?
                        <input type="number" id="cantEscaleras" min="1" max="10" value="5">
                    </label>
                </div>

                <div class="instruccion">
                    <p>📍 <strong>Haz click en el tablero para crear:</strong></p>
                    <p id="estado">Serpiente 1 - Click en casilla ALTA</p>
                    <p id="detalles"></p>
                </div>

                <div class="panel-tablero-config">
                    <div id="tableroConfig" class="tablero-config"></div>
                </div>

                <button id="btnComenzar" class="btn-comenzar" disabled>
                    Comenzar Juego ▶️
                </button>
            </div>
        </div>

        <!-- MODO JUEGO -->
        <div id="modoJuego" class="modo-inactivo">
            <div class="panel-superior">
                <div class="info">
                    <h2 id="turno">Turno Jugador 1</h2>
                    <p id="mensaje">Presiona el dado para iniciar</p>
                </div>
                <div class="dado" id="dado">🎲</div>
            </div>

            <div id="tablero" class="tablero"></div>

            <div class="panel-prediccion">
                <div class="prediccion">
                    <span>🔮 J1 turnos restantes:</span>
                    <span id="turnosJ1">-</span>
                </div>
                <div class="prediccion">
                    <span>🔮 J2 turnos restantes:</span>
                    <span id="turnosJ2">-</span>
                </div>
            </div>

            <div class="panel-jugadores">
                <div class="jugador rojo">
                    🔴 Jugador 1: <span id="pos1">1</span>
                </div>
                <div class="jugador azul">
                    🔵 Jugador 2: <span id="pos2">1</span>
                </div>
            </div>

            <button id="btnVolver" class="btn-volver">⬅️ Volver a Configurar</button>
        </div>
    </div>

    <script src="math-utils.js"></script>
    <script src="script.js"></script>
</body>
</html>

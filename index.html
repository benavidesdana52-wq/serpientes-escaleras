<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serpientes y Escaleras Avanzado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐍 Serpientes y Escaleras 🪜</h1>
        
        <!-- PANTALLA DE CONFIGURACION -->
        <div id="pantallaConfig" class="pantalla activa">
            <h2>⚙️ Configurar Juego</h2>
            
            <div class="config-panel">
                <label>Serpientes: <input type="number" id="numSerpientes" min="1" max="15" value="5"></label>
                <label>Escaleras: <input type="number" id="numEscaleras" min="1" max="15" value="5"></label>
            </div>
            
            <p id="instruccion" class="instruccion">Haz click en dos casillas para crear una serpiente o escalera</p>
            <div id="tableroConfig" class="tablero"></div>
            
            <button id="btnIniciar" class="btn" disabled>Comenzar Juego ▶️</button>
        </div>
        
        <!-- PANTALLA DE JUEGO -->
        <div id="pantallaJuego" class="pantalla">
            <div class="info-panel">
                <div>
                    <h3 id="turnoInfo">Turno: Jugador 1</h3>
                    <p id="mensajeInfo"></p>
                </div>
                <button id="btnDado" class="dado">🎲</button>
            </div>
            
            <div id="tableroJuego" class="tablero"></div>
            
            <div class="prediccion">
                <span>🔮 J1: <strong id="pred1">--</strong> turnos</span>
                <span>🔮 J2: <strong id="pred2">--</strong> turnos</span>
            </div>
            
            <div class="posiciones">
                <div>🔴 J1: <span id="pos1">1</span></div>
                <div>🔵 J2: <span id="pos2">1</span></div>
            </div>
            
            <button id="btnVolver" class="btn btn-secondary">⬅️ Volver</button>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>

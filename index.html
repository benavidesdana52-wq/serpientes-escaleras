<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serpientes y Escaleras</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pantalla">

        <h1>🐍 Serpientes y Escaleras 🪜</h1>

        <div class="panel-superior">

            <div class="info">
                <h2 id="turno">Turno Jugador 1</h2>
                <p id="mensaje">Presiona el dado para iniciar</p>
            </div>

            <div class="dado" id="dado">🎲</div>

        </div>

        <div id="tablero" class="tablero"></div>

        <div class="panel-jugadores">
            <div class="jugador rojo">
                🔴 Jugador 1: <span id="pos1">1</span>
            </div>

            <div class="jugador azul">
                🔵 Jugador 2: <span id="pos2">1</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
